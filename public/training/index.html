<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Training &amp; Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

[hidden]{display:none!important}img{max-width:100%}
/* Layout: sticky tab bar; Directory = search + filters on top, results left, profile right. */
:root{
  --bg:#F4F6FA; --s0:#E3EBF6;--s1:#BCD0EA;--s2:#8DAFD9;--s3:#5683BE;--s4:#2C5A97;--s5:#092C58;--on-s:#FFFFFF; --surface:#FFFFFF; --surface2:#EDF1F7; --ink:#0B1F3A; --muted:#566883; --line:#DAE1EB;
  --brand:#092C58; --on-brand:#FFFFFF; --brand-soft:#E3EBF6;
  --coral:#F25D5A; --coral-soft:#FDE6E5;
  --ok:#1E7B4F; --ok-soft:#DDF2E6; --warn:#9A6200; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FADAD7;
  --f-display:'Sora',system-ui,sans-serif; --f-body:'Manrope',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07142A; --s0:#16325C;--s1:#23497E;--s2:#34639F;--s3:#4C80C0;--s4:#76A3DC;--s5:#B4CFF2;--on-s:#07142A; --surface:#0D2241; --surface2:#122B50; --ink:#E7EDF7; --muted:#9BB0CB; --line:#1E3A62;
  --brand:#6E9EE3; --on-brand:#07142A; --brand-soft:#16325C; --coral:#F26F6C; --coral-soft:#4A2330;
  --ok:#5FD39A; --ok-soft:#133A2B; --warn:#F2C25F; --warn-soft:#44350F; --bad:#FF8F88; --bad-soft:#4A1F22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07142A; --s0:#16325C;--s1:#23497E;--s2:#34639F;--s3:#4C80C0;--s4:#76A3DC;--s5:#B4CFF2;--on-s:#07142A; --surface:#0D2241; --surface2:#122B50; --ink:#E7EDF7; --muted:#9BB0CB; --line:#1E3A62;
  --brand:#6E9EE3; --on-brand:#07142A; --brand-soft:#16325C; --coral:#F26F6C; --coral-soft:#4A2330;
  --ok:#5FD39A; --ok-soft:#133A2B; --warn:#F2C25F; --warn-soft:#44350F; --bad:#FF8F88; --bad-soft:#4A1F22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1280px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 8px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark i{display:block;width:14px;height:14px;border-radius:50%;background:var(--coral)}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:8px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--coral)}
nav button:hover{color:var(--ink)}
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner b{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 14px}
.search:focus-within{border-color:var(--brand)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;font-size:16px;outline:0}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px 10px}
.modes button,.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"],.chip-btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip-btn span{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,input[type=text],input[type=email],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:980px){.split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}
  #profile{position:sticky;top:60px;max-height:calc(100vh - 76px);overflow:auto}
  #list{max-height:calc(100vh - 76px);overflow:auto;padding-right:4px}}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.count{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.res{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.res:hover{border-color:var(--brand)}
.res[aria-current="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:700 14px var(--f-display);display:grid;place-items:center;flex:none}
.res .main{min-width:0;flex:1}
.res .nm{font-weight:700}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{background:var(--surface2);border-radius:6px;padding:2px 8px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.tag.hit{background:var(--coral-soft);box-shadow:inset 0 0 0 1px var(--coral)}
.dots{display:inline-flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.tag .yrs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
mark{background:var(--coral-soft);color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 -1px 0 var(--coral) inset}
.pin{font:500 12px var(--f-mono);background:var(--surface2);border-radius:6px;padding:2px 7px;color:var(--muted)}
.empty{color:var(--muted);padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);margin-bottom:4px}
#profile .card{padding:20px}
.phead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.phead .av{width:56px;height:56px;font-size:19px}
.phead h2{font-size:21px}
.email{font-size:13px;color:var(--muted);user-select:all;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sec{margin-top:20px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec>h3 small{text-transform:none;letter-spacing:0;font-weight:500;font-family:var(--f-body)}
.catrow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:4px 12px;padding-block:7px;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0}
.catrow>b{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:3px}
.catrow .tags{margin-top:0}
@media(max-width:560px){.catrow{grid-template-columns:minmax(0,1fr)}}
.lines{margin:0;padding-left:18px;display:grid;gap:5px}
.lines li{overflow-wrap:anywhere}
.edu{margin:0;padding-left:18px;display:grid;gap:9px}
.edu>li{overflow-wrap:anywhere}
.edu .deg{font-weight:600}
.edu ul{margin:3px 0 0;padding-left:16px;list-style:circle;color:var(--muted);font-size:13px;display:grid;gap:1px}
.blocks{display:grid;gap:10px}
.blocks div{white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:12px;font-size:13.5px}
.vpill{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:700;margin-right:6px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.panel{padding:18px}
.panel h2{font-size:15px;margin-bottom:4px}
.panel p.hint{margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(90px,40%) 1fr 36px;gap:10px;align-items:center;margin-bottom:7px;font-size:13px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--surface2);border-radius:5px;height:12px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
button.bar{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
button.bar:hover .lbl{text-decoration:underline}
.rows{display:grid;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.row span{color:var(--muted)}
.vcard{margin-bottom:12px;overflow:hidden}
.vcard>header{padding:12px 16px;background:var(--surface2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.holder{display:grid;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 16px;cursor:pointer}
.holder:hover{background:var(--brand-soft)}
.holder small{color:var(--muted)}
.holder .ct{font-size:13px;overflow-wrap:anywhere}
form.f{display:grid;gap:14px;max-width:880px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
label.fl{display:grid;gap:5px;font-weight:600;font-size:13px}
label.fl small{font-weight:400;color:var(--muted)}
label.fl input,label.fl textarea,label.fl select{width:100%;font-weight:400}
textarea{resize:vertical;min-height:84px;font-size:13.5px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:92vw}
.hint{color:var(--muted);font-size:13px}
.inssec{margin-top:26px;scroll-margin-top:60px}
.inshead{margin-bottom:12px}
.inshead h2{font-size:18px}
.inshead p{margin:4px 0 0}
.insnav{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;position:static;border:0;background:none}
.insnav a{font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
.insnav a:hover{border-color:var(--brand)}
.panel.wide{grid-column:1/-1}
.st-ex{background:var(--brand-soft);color:var(--brand)}.st-ok{background:var(--ok-soft);color:var(--ok)}.st-dev{background:var(--warn-soft);color:var(--warn)}.st-gap{background:var(--bad-soft);color:var(--bad)}.st-na{background:var(--surface2);color:var(--muted)}.st-plain{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.stack i.st-ex,.solidlg .lg i.st-ex{background:var(--brand)}.stack i.st-ok,.solidlg .lg i.st-ok{background:var(--ok)}.stack i.st-dev,.solidlg .lg i.st-dev{background:var(--warn)}.stack i.st-gap,.solidlg .lg i.st-gap{background:var(--bad)}
.lvbar{position:relative;display:inline-block;width:110px;height:10px;border-radius:5px;background:var(--surface2);vertical-align:middle}
.lvbar i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:5px}
.lvbar b{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;background:var(--coral);border-radius:2px}
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lvlcard{border:1px solid var(--line);border-radius:10px;padding:12px}
.lvltop{display:flex;gap:8px;align-items:center}
.lvltop b{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--f-display);flex:none}
.lvltop span{font-weight:700}
.lvlcard small{color:var(--muted)}
.lvlcard p{margin:6px 0 0;font-size:13px}
.domgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.domcard{padding:16px;display:flex;flex-direction:column}
.domhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.domstat{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
.domstat b{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
td.sm{font-size:12.5px}
table.compheat td{width:64px;min-width:64px;font-weight:600}
table.comptbl td{vertical-align:middle}

.grid2.ins2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
table.heat .rowh{position:sticky;left:0;background:var(--surface);z-index:1}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:12px 0 0}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:2px 0 12px;font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stackrow{display:grid;grid-template-columns:minmax(100px,24%) 1fr 36px;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.stackrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stackrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.tblx{overflow-x:auto;max-width:100%}
table.mini{border-collapse:collapse;width:100%;font-size:13px}
table.mini th,table.mini td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.mini th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{color:var(--bad);font-weight:700}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12px;min-width:760px}
table.heat th{font-weight:600;color:var(--muted);text-align:left;vertical-align:bottom;padding:4px}
table.heat thead th span{display:block;width:72px;line-height:1.2;font-size:10.5px;overflow-wrap:anywhere;hyphens:auto}
table.heat .rowh{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:500;padding-right:10px}
table.heat td{width:72px;min-width:72px;height:30px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.h0{background:var(--surface2)}
.h1{background:var(--s0);color:var(--ink)}.h2{background:var(--s1);color:var(--ink)}.h3{background:var(--s2);color:var(--ink)}
.h4{background:var(--s3);color:var(--on-s)}.h5{background:var(--s5);color:var(--on-s)}
.legendrow .h0,.legendrow .h1,.legendrow .h2,.legendrow .h3,.legendrow .h4,.legendrow .h5{width:14px;height:14px}
.bar.two .tr{position:relative}
.bar.two .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar.two .tr i.any{background:var(--s1)}
.bar.two .tr i.deep{background:var(--brand)}
.bar .n small{color:var(--muted);font-size:11px}
.bar.two{grid-template-columns:minmax(90px,38%) 1fr 62px}
.tbform{display:flex;flex-wrap:wrap;gap:12px}
.tbrow,.prow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.tbrow:hover,.prow:hover{border-color:var(--brand)}
.prow{justify-content:space-between;align-items:center}
.prow small,.tbrow small{color:var(--muted)}
.prow .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tbcov{flex:none;min-width:44px;text-align:center;font-weight:700;border-radius:8px;padding:4px 6px;background:var(--surface2);font-variant-numeric:tabular-nums}
.tbcov.full{background:var(--ok-soft);color:var(--ok)}
.tbmain{min-width:0;flex:1}
.tag.miss{background:none;border:1px dashed var(--line);color:var(--muted)}

.legend{display:inline-flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.drop{position:relative;display:grid;place-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:30px 16px;margin-block:14px;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--coral);outline-offset:2px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:480px}
.tblwrap table{border-collapse:collapse;width:100%;font-size:13px}
.tblwrap th,.tblwrap td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tblwrap th{background:var(--surface2);font-weight:700;position:sticky;top:0}
.tblwrap td.msg{white-space:normal;min-width:200px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;margin-block:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface2);color:var(--muted)}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--brand-soft);color:var(--brand)}
#gate{display:grid;place-items:center;padding-block:8vh 40px}
.gatecard{width:100%;max-width:420px;padding:28px}
.gatecard h2{font-size:20px;margin-bottom:6px}
.gatecard form{display:grid;gap:12px;margin-top:16px}
.gatecard input{width:100%;font-size:16px;padding:11px 12px}
.lockicon{width:44px;height:44px;border-radius:12px;background:var(--brand);display:grid;place-items:center;margin-bottom:14px;color:var(--on-brand)}
.acc{max-width:720px;display:grid;gap:16px}
.acc .card{padding:20px}
.acc ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}

  body.print-ov header,body.print-ov nav,body.print-ov .toolbar,body.print-ov #app>section:not(#tab-ov),body.print-ov .noprint{display:none!important}

</head><body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark tr" aria-hidden="true"><i></i></div>

    </div>
    <div class="hdr-tools"><div class="hdr-right" id="hdrRight" hidden><a class="btn sm" href="/" title="Open the Skill Map">Skill Map ↗</a><span class="sync" id="syncChip"></span><span class="role" id="roleChip"></span><button class="btn sm" type="button" data-act="lock">Lock</button></div><button class="btn sm themebtn" type="button" id="themeBtn">Theme</button></div>

<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
/* ---------- basics ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>String(s??'').toLowerCase();
const num=v=>{const n=Number(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const fmtH=n=>fmt(n,1);
const bdt=n=>'৳'+fmt(n);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=(iso,txt)=>{if(!iso) return txt||'No date';const [y,m,d]=iso.split('-');return `${+d} ${MON[+m-1]} ${y}`};
const today=()=>new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const initials=n=>String(n||'?').replace(/\b(md|mohammad|muhammad|mst|dr|mr|mrs)\.?\s+/ig,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
// Name key for matching people across files: ignores case, dots and common prefixes.
const nameKey=s=>lc(s).replace(/\b(md|mohammad|mohammed|muhammad|mohd|mst|mrs|mr|dr|engr|sk)\b\.?/g,' ').replace(/[^a-z]/g,'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3600)}
function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
const CLASS_TYPES=['Master Class','Workshop','BRAC IT Academy','Knowledge Jam','Bootcamp','E-learning','Seminar'];
const CATEGORIES=['Technical Training','Functional Training','Behavioural Training','Leadership Training','Compliance Training'];
const IND_TYPES=['International Certification course','Local Training','Online Course','Conference'];
const PAY=['Done','Pending','In Process'];
const PLAN_ST=['Idea','Planned','Scheduled','Delivered','Dropped'];

/* Skill areas link training topics to Skill Map skill categories. */
const AREAS=[
 {n:'AI & Machine Learning',re:/\b(ai|genai|gen ai|llm|gpt|copilot|machine learning|ml|deep learning|artificial intelligence|data science|prompt)\b/i,cats:['Machine Learning & AI','Generative AI & LLM','AI / ML Framework'],tech:1},
 {n:'Data & Databases',re:/\b(data|database|databricks|sql|power ?bi|analytics|etl|warehouse|tableau|big data)\w*/i,cats:['Database — SQL','Database — NoSQL','Database — Analytical','Database and Data Stores','Data Engineering and Architecture','Data Engineering Tool','BI & Analytics','Analytics, BI and Statistics'],tech:1},
 {n:'Cloud & DevOps',re:/\b(cloud|devops|kubernetes|k8s|docker|aws|azure|gcp|ci\/cd|terraform|cka|cks|linux|infrastructure|sre)\b/i,cats:['Cloud Platform','Containerization & Orchestration','CI/CD & DevOps Tool','Infrastructure as Code','Cloud, DevOps and Operations','Monitoring & Observability'],tech:1},
 {n:'Software Engineering',re:/\b(coding|development|developer|programming|architecture|java|python|\.net|react|api|microservices?|software engineering|clean code|backend|frontend|mobile)\b/i,cats:['Programming Language','Frontend Framework','Backend Framework','API & Protocol','Mobile Framework','Software Engineering & Architecture','Message Queue / Event Streaming','Integration Platform & ESB'],tech:1},
 {n:'Testing & Quality',re:/\b(test|testing|qa|quality|istqb|sqa)\b/i,cats:['Testing Tool'],skillRe:/selenium|cypress|playwright|appium|jmeter|postman|k6|testng|junit|cucumber|katalon|testrail|test/i,depts:['Software Quality Assurance'],tech:1},
 {n:'Security',re:/\b(security|cyber|iso ?27001|owasp|penetration|soc)\b/i,cats:['Security Tool'],tech:1},
 {n:'Delivery & Project Management',re:/\b(delivery|project|agile|scrum|pmp|bottleneck|kanban|okr|governance|prince2)\b/i,cats:['Project Management','Delivery Management','Governance / Compliance']},
 {n:'Business Analysis & Product',re:/\b(business analysis|requirements?|product|ux|ui|design thinking|cbap|ecba)\b/i,cats:['Business Analysis','Design / UX Tool','ERP / CRM / Enterprise Platform']},
 {n:'Leadership & Management',re:/\b(leader\w*|supervision|supervisor|manag\w*|coaching|vision|strateg\w*|mentor\w*|transformation)\b/i,cats:['Business, Delivery and Leadership']},
 {n:'Personal Effectiveness',re:/\b(intention|success|communication|mindset|wellbeing|well-being|stress|soft skills?|presentation|emotional|time management|behaviou?r\w*|negotiation)\b/i,cats:['Client Relationship','Training / Facilitation']},
 {n:'Compliance, Finance & Operations',re:/\b(tax|e-return|return filing|compliance|finance|policy|legal|procurement|hr|safety|anti)\b/i,cats:['Finance & Accounting','Procurement','Administration','HR','Commercial / Presales','Marketing & Communications','ITSM / Service Desk Tool']}
];
const CAT2AREA={};AREAS.forEach(a=>a.cats.forEach(c=>CAT2AREA[c]=a.n));
const TECH_AREAS=new Set(AREAS.filter(a=>a.tech).map(a=>a.n));
function autoAreas(text){const t=String(text||'');const hit=AREAS.filter(a=>a.re.test(t)).map(a=>a.n);return hit.slice(0,2)}
const sessAreas=s=>Array.isArray(s.areas)&&s.areas.length?s.areas:autoAreas(`${s.topic} ${s.objective||''}`);
// Does a Skill Map person work in this area? Categories, plus skill names or departments where the survey had no category for it.
const inArea=(a,d,deep)=>(d.skills||[]).some(s=>(a.cats.includes(s.cat)||(a.skillRe&&a.skillRe.test(s.name)))&&(!deep||s.level>=4))||(!!a.depts&&a.depts.includes(DEPT_ALIAS[d.dept]||d.dept)&&(!deep||(+d.exp||0)>=5));
const indAreas=i=>Array.isArray(i.areas)&&i.areas.length?i.areas:autoAreas(i.title);

/* ---------- server ---------- */
let isEditor=false, me={name:'',role:''}, lastActive=Date.now(), unlocked=false;
const IDLE_MS=30*60*1000;
async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'skillmap'},body:opt.body?JSON.stringify(opt.body):undefined});
  let j=null; try{j=await r.json()}catch(_){}
  if(r.status===401&&!opt.login){if(unlocked) lock('You were signed out (from another tab, or the session reached its limit). Enter the passcode again.',{local:true});throw {code:'auth',message:'Not signed in.'}}
  if(!r.ok) throw {code:r.status,message:(j&&j.error)||('Server error '+r.status)};
  return j;
}
const post=body=>api('/api/training',{method:'POST',body});
// Split large saves so each request stays well under the hosting limits.
async function putMany(coll,items,o={}){
  let batch=[],size=0;
  // Attendance saves keep the session's invite list unless a new one is sent.
  if(coll==='att') items=items.map(it=>{const o=RAW.att[it.id]||{};return {...it,...('invited' in it?{}:{invited:o.invited}),...('waitlist' in it?{}:{waitlist:o.waitlist})}});
  const flush=async()=>{if(!batch.length) return;await post({action:'put',coll,items:batch,quiet:o.quiet,note:o.note});batch=[];size=0};
  for(const it of items){const n=JSON.stringify(it).length;if(batch.length&&(size+n>650000||batch.length>=800)) await flush();batch.push(it);size+=n}
  await flush();
}
async function delMany(coll,ids,o={}){for(let i=0;i<ids.length;i+=800) await post({action:'del',coll,ids:ids.slice(i,i+800),note:o.note,quiet:o.quiet})}
async function saveSettings(patch,note){const st={...(RAW.settings||{}),...patch};delete st.updatedAt;delete st.updatedBy;await post({action:'settings',settings:st,note});RAW.settings=st;rebuild()}

/* ---------- data ---------- */
let RAW={sess:{},att:{},ind:{},emp:{},plan:{},prog:{},course:{},settings:{}}, SM={}, DEPT_ALIAS={}, loaded=false;
const SYNC={tv:null,sv:null,at:0,timer:null};
async function loadAll(force){
  try{
    const [tv,sv]=await Promise.all([api('/api/training?versionOnly=1').then(j=>j.version),api('/api/employees?versionOnly=1').then(j=>j.version).catch(()=>SYNC.sv)]);
    SYNC.at=Date.now();renderSync();
    let changed=false;
    if(force||tv!==SYNC.tv){const j=await api('/api/training');RAW={sess:j.sess||{},att:j.att||{},ind:j.ind||{},emp:j.emp||{},plan:j.plan||{},prog:j.prog||{},course:j.course||{},settings:j.settings||{}};SYNC.tv=j.version;changed=true}
    if(force||sv!==SYNC.sv){
      let cursor='0',items=[];
      try{do{const j=await api('/api/employees?cursor='+cursor);items.push(...j.items);cursor=j.cursor}while(cursor!=='0');
        try{const st=(await api('/api/settings')).settings||{};DEPT_ALIAS=st.deptAlias&&typeof st.deptAlias==='object'?st.deptAlias:{}}catch(_){}
        SM={};items.forEach(d=>{if(d&&d.pin) SM[String(d.pin)]=d});SYNC.sv=sv}catch(e){if(e.code==='auth') throw e}
      changed=true}
    if(changed){loaded=true;rebuild()}
  }catch(e){if(e.code!=='auth') toast('Could not load training data: '+(e.message||'server error'))}
}
function renderSync(){const el=$('#syncChip');if(!el||!SYNC.at) return;const s=Math.round((Date.now()-SYNC.at)/1000);el.textContent=s<60?'Updated just now':`Updated ${Math.round(s/60)} min ago`}
setInterval(renderSync,15000);

/* ---------- model ---------- */
let MD=null;
const ui={tab:'ov',year:'',deptSrc:'sm',sq:'',sKind:'',sCat:'',sClass:'',sSel:null,attQ:'',pq:'',pDept:'',pStat:'Active',pTr:'',pSort:'hours',pSel:null,pShow:80,tq:'',tSel:null,bArea:'',iq:'',iKind:'',iPay:'',dqOpen:{},imp:null,covSel:''};
function years(){const y=new Set();Object.values(RAW.sess).forEach(s=>s.year&&y.add(String(s.year)));Object.values(RAW.ind).forEach(i=>i.year&&y.add(String(i.year)));Object.values(RAW.plan).forEach(p=>p.year&&y.add(String(p.year)));return [...y].sort().reverse()}
function rebuild(){MD=build();renderAll()}
function build(){
  const st=RAW.settings||{}, alias=st.pinAlias||{}, talias=st.trainerAlias||{};
  const rp=p=>{p=String(p??'').trim().replace(/\.0$/,'');let n=0;while(alias[p]&&n++<6) p=String(alias[p]);return p};
  const inYear=x=>!ui.year||String(x.year)===ui.year;
  const P={}, byName={};
  const ensure=(pin,hint)=>{let p=P[pin];if(!p){p=P[pin]={pin,name:'',desig:'',dept:'',trDept:'',unit:'',status:'',inMaster:false,sm:null,sess:[],allSess:[],hours:0,ind:[],spend:0,altNames:new Set(),delivered:[]}}
    if(hint){if(!p.name&&hint.name) p.name=hint.name;if(!p.desig&&hint.desig) p.desig=hint.desig;if(!p.trDept&&hint.dept) p.trDept=hint.dept;if(hint.name&&p.name&&nameKey(hint.name)!==nameKey(p.name)) p.altNames.add(hint.name)}
    return p};
  Object.values(RAW.emp).forEach(e=>{const p=ensure(String(e.pin));p.inMaster=true;p.name=e.name||p.name;p.desig=e.desig||p.desig;p.trDept=e.dept||p.trDept;p.unit=e.unit||'';p.status=e.status||''});
  Object.values(SM).forEach(d=>{const p=ensure(String(d.pin));p.sm=d;if(!p.name) p.name=d.name;if(!p.desig) p.desig=d.desig||'';if(!p.status) p.status='Active'});
  // Sessions (all years are kept for trainer history; the year filter applies to totals).
  const all=Object.values(RAW.sess).map(s=>({...s,trainers:(s.trainers||[]).map(t=>talias[lc(t)]||t)}));
  const sessions=all.filter(inYear).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.id).localeCompare(String(a.id)));
  for(const s of sessions){
    const rows=(RAW.att[s.id]&&RAW.att[s.id].rows)||[];const seen=new Set();
    s._att=[];s._dups=0;s._excl=0;s._dupRows=[];
    for(const r of rows){
      const pin=rp(r[0]);if(!pin) continue;
      if(r[5]===0||r[5]==='0'){s._excl++;continue}
      if(seen.has(pin)){s._dups++;s._dupRows.push(r);continue}
      seen.add(pin);
      const p=ensure(pin,{name:r[1],dept:r[2],desig:r[3]});
      const h=r[4]!==''&&r[4]!=null&&!isNaN(+r[4])?+r[4]:(+s.hours||0);
      p.sess.push({s,h});p.hours+=h;s._att.push({p,h,raw:r});
    }
    s._n=s._att.length;s._lh=s._att.reduce((a,x)=>a+x.h,0);s._areas=sessAreas(s);
  }
  const ind=Object.values(RAW.ind).filter(inYear).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  for(const i of ind){const pin=rp(i.pin);i._pin=pin;if(!pin) continue;const p=ensure(pin,{name:i.name,dept:i.dept,desig:i.desig});p.ind.push(i);p.spend+=num(i.amount)}
  // Department and status.
  const people=Object.values(P);
  people.forEach(p=>{
    const smDept=p.sm?(DEPT_ALIAS[p.sm.dept]||p.sm.dept||''):'';
    p.dept=(ui.deptSrc==='sm'?(smDept||p.trDept):(p.trDept||smDept))||'No department';
    if(!p.name) p.name='(name unknown)';
    if(!p.status) p.status=p.inMaster?'Unknown':'Not in employee list';
    p.counted=p.ind.filter(i=>+i.count!==0).length;
    p.trained=p.sess.length>0||p.counted>0;
    byName[nameKey(p.name)]=(byName[nameKey(p.name)]||[]).concat(p);
  });
  // Trainers.
  const T={};
  for(const s of all){
    (s.trainers||[]).forEach((t,ix)=>{
      const k=lc(t);const x=T[k]=T[k]||{key:k,name:t,kinds:new Set(),orgs:new Set(),desigs:new Set(),all:[],sessions:[],hours:0,learners:new Set(),lh:0,pin:''};
      x.kinds.add(s.kind||'');if(s.org) x.orgs.add(s.org);if(s.trainerDesig) x.desigs.add(s.trainerDesig);x.all.push(s);
      if(s.trainerPins&&s.trainerPins[ix]) x.pin=rp(s.trainerPins[ix]);
      if(inYear(s)){const ys=sessions.find(z=>z.id===s.id);x.sessions.push(ys);x.hours+=+s.hours||0;ys._att.forEach(a=>x.learners.add(a.p.pin));x.lh+=ys._lh}
    })}
  Object.values(T).forEach(x=>{
    if(!x.pin&&[...x.kinds].includes('Internal')){const c=(byName[nameKey(x.name)]||[]).filter(p=>p.inMaster||p.sm);if(c.length===1) x.pin=c[0].pin}
    if(x.pin&&P[x.pin]) P[x.pin].delivered=x.all;
  });
  // Every session each person attended, in any year (used for required training and programmes).
  all.forEach(s=>{const seen=new Set();(((RAW.att[s.id]||{}).rows)||[]).forEach(r=>{if(r[5]===0||r[5]==='0') return;const pin=rp(r[0]);if(!pin||seen.has(pin)) return;seen.add(pin);if(P[pin]) P[pin].allSess.push(s)})});
  const active=people.filter(p=>p.status==='Active');
  return {P,people,active,sessions,ind,T,trainers:Object.values(T),rp,byName,all};
}
const deptList=()=>[...new Set(MD.people.filter(p=>p.status==='Active'||p.trained).map(p=>p.dept))].sort();

/* ---------- shared bits ---------- */
const bars=(items,max,o={})=>items.map(([l,n,t,key])=>`<${o.act?`button type="button" class="bar" data-${o.act}="${esc(key??l)}"`:'div class="bar"'} title="${esc(t||`${l}: ${o.f?o.f(n):fmt(n)}`)}"><span class="lbl">${esc(l)}</span><span class="tr"><i style="width:${max?Math.max(2,n/max*100):0}%"></i></span><span class="n">${o.f?o.f(n):fmt(n)}</span></${o.act?'button':'div'}>`).join('');
const kpi=(v,l,s,cls='')=>`<div class="card kpi ${cls}"><b>${v}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
const kindPill=k=>k?`<span class="pill ${k==='External'?'ext':'int'}">${esc(k)}</span>`:'';
const statPill=s=>`<span class="pill ${s==='Active'?'ok':s==='Resigned'?'none':s==='Hold'?'soon':'bad'}">${esc(s)}</span>`;
const yearLabel=()=>ui.year||'all years';
const emptyBox=(t,b)=>`<div class="empty"><b>${t}</b>${b}</div>`;
function noData(){return emptyBox('No training records yet',isEditor?'Open <b>Import &amp; export</b> and upload the training workbook to get started.':'Ask an HR editor to import the training workbook.')}
const target=()=>+((RAW.settings.targets||{}).hours)||12;
function sumBy(list,kf,vf){const o={};list.forEach(x=>{const k=kf(x);if(k==null) return;o[k]=(o[k]||0)+vf(x)});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function deptStats(){
  const D={};
  MD.people.forEach(p=>{if(p.status!=='Active') return;const d=D[p.dept]=D[p.dept]||{dept:p.dept,head:0,reached:0,hours:0,sess:0};d.head++;if(p.trained) d.reached++;d.hours+=p.hours;d.sess+=p.sess.length});
  return Object.values(D).sort((a,b)=>b.head-a.head);
}

/* ---------- overview ---------- */

  const top=[...S].sort((a,b)=>b._n-a._n)[0]; if(top) F.push(`Largest session: <b>${esc(top.topic)}</b> with ${fmt(top._n)} attendees.`);
  const catH=sumBy(S,s=>s.category||'Uncategorised',s=>s._lh); if(catH.length) F.push(`${esc(catH[0][0])} accounts for <b>${pct(catH[0][1],lh)}%</b> of learner-hours.`);
  const nofb=S.length-fb; if(nofb) F.push(`<b>${nofb} of ${S.length}</b> sessions have no feedback recorded, so their impact cannot be shown.`);
  const zero=S.filter(s=>!s._n).length; if(zero) F.push(`<b>${zero}</b> session${zero>1?'s have':' has'} no attendance list.`);
  // Monthly series (one series: learner-hours).

  <div class="kpis">
   ${kpi(fmt(S.length),'Group sessions',`${intl.length} internal · ${ext.length} external${PY?delta(S.length,PY.sessions):''}`)}

   ${kpi(fmt(learners.length),'Unique learners',`${fmt(MD.people.filter(p=>p.sess.length&&p.status!=='Active').length)} have since left or are not on the list`)}
   ${kpi(pct(reached.length,act.length)+'%','Active employees reached',`${fmt(reached.length)} of ${fmt(act.length)}${PY?delta(pct(reached.length,act.length),PY.reach,v=>v,' pts'):''}`)}
   ${kpi(fmtH(avg),'Hours per active employee',`Target ${target()} hours${PY?delta(+avg.toFixed(1),+PY.hpe.toFixed(1),fmtH):''}`,avg<target()?'alert':'')}

   ${(()=>{const I=S.map(inviteStats).filter(Boolean);if(!I.length) return '';const inv=I.reduce((a,x)=>a+x.inv,0),ns=I.reduce((a,x)=>a+x.noShow.length,0);return kpi(pct(ns,inv)+'%','Did not come when invited',`${fmt(ns)} of ${fmt(inv)} invitations · ${I.length} session${I.length===1?'':'s'}`,pct(ns,inv)>25?'alert':'')})()}

     return `<div class="card panel"><h2>Feedback</h2><p class="hint">Average rating out of 5, weighted by responses.</p>${bars(byCat,5,{f:v=>fmt(v,1)})}<h3 style="font-size:13px;margin:12px 0 6px">Lowest-rated sessions</h3>${bars([...R].sort((a,b)=>a.feedback.avg-b.feedback.avg).slice(0,4).map(s=>[s.topic,s.feedback.avg,`${s.topic}: ${fmt(s.feedback.avg,2)} from ${s.feedback.n||'?'} responses`,s.id]),5,{f:v=>fmt(v,1),act:'ses'})}</div>`})()}
   <div class="card panel wide"><h2>Reach by department</h2><p class="hint">Active employees only. Departments ${ui.deptSrc==='sm'?'follow the Skill Map structure where the person is on it':'are as written in the training records'}.</p>
    <div class="tblx"><table class="mini"><thead><tr><th>Department</th><th class="num">Active</th><th class="num">Reached</th><th style="min-width:140px">Reach</th><th class="num">Hours per head</th><th class="num">Not yet trained</th></tr></thead><tbody>
    ${ds.map(d=>`<tr><td><button class="linkbtn" type="button" data-pdept="${esc(d.dept)}">${esc(d.dept)}</button></td><td class="num">${d.head}</td><td class="num">${d.reached}</td><td><span class="lvbar" title="${pct(d.reached,d.head)}%"><i style="width:${pct(d.reached,d.head)}%"></i></span> <span class="${pct(d.reached,d.head)<50?'flag':''}">${pct(d.reached,d.head)}%</span></td><td class="num ${d.hours/d.head<target()?'':''}">${fmtH(d.hours/d.head)}</td><td class="num">${d.head-d.reached?`<button class="linkbtn" type="button" data-pnever="${esc(d.dept)}">${d.head-d.reached}</button>`:'0'}</td></tr>`).join('')}

    (!q||lc(`${s.id} ${s.topic} ${s.trainers.join(' ')} ${s.org||''} ${s.category} ${s.classType} ${s._areas.join(' ')}`).includes(q)));

/* ---------- people ---------- */
function pplFiltered(){
  const q=lc(ui.pq).trim();
  let L=MD.people.filter(p=>(p.inMaster||p.sm||p.trained)&&(!ui.pDept||p.dept===ui.pDept)&&(!ui.pStat||(ui.pStat==='Other'?p.status!=='Active':p.status===ui.pStat))&&
    (!ui.pTr||(ui.pTr==='yes'?p.trained:!p.trained))&&(!q||lc(`${p.pin} ${p.name} ${[...p.altNames].join(' ')} ${p.desig} ${p.dept}`).includes(q)));
  const sorters={hours:(a,b)=>b.hours-a.hours||a.name.localeCompare(b.name),name:(a,b)=>a.name.localeCompare(b.name),sess:(a,b)=>b.sess.length-a.sess.length||a.name.localeCompare(b.name),ind:(a,b)=>b.ind.length-a.ind.length||b.spend-a.spend,least:(a,b)=>a.hours-b.hours||a.name.localeCompare(b.name)};
  return L.sort(sorters[ui.pSort]||sorters.hours);
}

const LV5=s=>s.level>=5;
function benchModel(){
  // Internal trainer bench from the Skill Map: 8+ years in a technical skill, ranked by readiness.
  const trainerPins=new Set(MD.trainers.map(t=>t.pin).filter(Boolean)), trainerNames=new Set(MD.trainers.map(t=>nameKey(t.name)));
  const LEAD=/\b(lead|head|manager|architect|principal|director|chief|cto|senior manager)\b/i;
  return Object.values(SM).filter(d=>!d.unmapped&&(d.skills||[]).length).map(d=>{
    const deep=(d.skills||[]).filter(s=>LV5(s)&&TECH_AREAS.has(CAT2AREA[s.cat]));if(!deep.length) return null;
    const areas=[...new Set(deep.map(s=>CAT2AREA[s.cat]))];
    const lead=LEAD.test(d.desig||''), exp=+d.exp||0, certs=(d.certs||[]).length;
    const teach=(d.skills||[]).some(s=>s.cat==='Training / Facilitation')||[...(d.experience||[]),...(d.memberships||[])].some(t=>/\b(train(ed|er|ing)? (team|junior|new|staff|engineers?)|mentor\w*|coach\w*|teach\w*|instructor|lecturer|facilitat\w*|workshop)/i.test(t));
    const already=trainerPins.has(String(d.pin))||trainerNames.has(nameKey(d.name));
    const rate=lead&&teach?'Ready':(lead||teach||certs)?'With support':'Subject expert';
    const p=MD.P[String(d.pin)];
    return {d,deep,areas,lead,exp,teach,already,rate,status:p?p.status:'Active'};
  }).filter(x=>x&&x.status==='Active').sort((a,b)=>['Ready','With support','Subject expert'].indexOf(a.rate)-['Ready','With support','Subject expert'].indexOf(b.rate)||b.deep.length-a.deep.length||a.d.name.localeCompare(b.d.name));
}

function covModel(){
  const smAct=Object.values(SM).filter(d=>!d.unmapped&&(d.skills||[]).length&&(!MD.P[d.pin]||MD.P[d.pin].status==='Active'));
  return AREAS.map(a=>{
    const any=smAct.filter(d=>inArea(a,d)), deep=any.filter(d=>inArea(a,d,true));
    const ss=MD.sessions.filter(s=>s._areas.includes(a.n)), learners=new Set();ss.forEach(s=>s._att.forEach(x=>learners.add(x.p.pin)));
    const ii=MD.ind.filter(i=>+i.count!==0&&indAreas(i).includes(a.n));ii.forEach(i=>learners.add(i._pin));
    const reachedPr=any.filter(d=>learners.has(String(d.pin))).length;
    return {a,any,deep,ss,ii,learners,reachedPr,lh:ss.reduce((t,s)=>t+s._lh,0),spend:ii.reduce((t,i)=>t+num(i.amount),0)};
  });
}

function dqModel(){
  const known=p=>p.inMaster||p.sm;
  const unknown=MD.people.filter(p=>!known(p)&&(p.sess.length||p.ind.length)).map(p=>({p,cands:(MD.byName[nameKey(p.name)]||[]).filter(c=>c.pin!==p.pin&&known(c))})).sort((a,b)=>b.cands.length-a.cands.length||a.p.name.localeCompare(b.p.name));
  const names=MD.people.filter(p=>known(p)&&p.altNames.size);
  const linked=new Set(Object.keys(RAW.settings.pinAlias||{})), notSame=new Set(RAW.settings.notSame||[]);
  const older=MD.people.filter(p=>p.status!=='Active'&&p.trained&&!linked.has(p.pin)).map(p=>({p,cands:(MD.byName[nameKey(p.name)]||[]).filter(c=>c.pin!==p.pin&&c.status==='Active'&&!notSame.has(p.pin+'>'+c.pin))})).filter(x=>x.cands.length);
  const dups=MD.sessions.filter(s=>s._dups||s._excl);
  const issues=MD.sessions.map(s=>{const L=s.links||{},F=s.flags||{},w=[];if(!s._n) w.push('No attendance list');if(!s.date) w.push('No usable date');if(!s.trainers.length) w.push('No trainer');if(lc(s.feedbackCollected)!=='yes') w.push('Feedback not collected');if(!(L.evidence||F.evidence)) w.push('No evidence');if(!s.hours) w.push('No hours');return {s,w}}).filter(x=>x.w.length);
  const T=MD.trainers, pairs=[];
  const toks=n=>nameKey(n.replace(/\b(md|mohammad|muhammad)\b\.?/ig,' '));
  for(let i=0;i<T.length;i++) for(let j=i+1;j<T.length;j++){
    const a=toks(T[i].name),b=toks(T[j].name);if(!a||!b) continue;
    const parts=x=>lc(x).replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['md','dr','mohammad','muhammad'].includes(w));
    const pa=parts(T[i].name),pb=parts(T[j].name),common=pa.filter(w=>pb.includes(w)).length;
    if(a===b||(a.length>=8&&b.length>=8&&(a.includes(b)||b.includes(a)))||(common>=2&&common>=Math.min(pa.length,pb.length)-0)) pairs.push([T[i],T[j]]);
  }
  const bad=T.filter(t=>/^[\s—–\-?.]*$/.test(t.name)||/\b(team|various|tbd|n\/a)\b/i.test(t.name));
  const noDept=MD.active.filter(p=>p.dept==='No department');
  const indIssues=MD.ind.map(i=>{const w=[],p=MD.P[i._pin];if(!p||!known(p)) w.push('PIN not on the employee list');if(!num(i.amount)) w.push('No amount');if(i.payStatus&&i.payStatus!=='Done') w.push('Payment '+lc(i.payStatus));return {i,w}}).filter(x=>x.w.length);
  return {older,unknown,names,dups,issues,pairs,bad,noDept,indIssues};
}

function isoFromParts(y,m,d){y=+y;if(y<100) y+=2000;if(!(m>=1&&m<=12&&d>=1&&d<=31&&y>1990&&y<2100)) return '';return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function parseDate(v,t){
  if(v==null||v==='') return '';
  if(typeof v==='number'&&t!=='s'){const p=XLSX.SSF.parse_date_code(v);return p?isoFromParts(p.y,p.m,p.d):''}
  if(v instanceof Date) return isoFromParts(v.getFullYear(),v.getMonth()+1,v.getDate());
  const s=String(v).trim();let m;
  if((m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return isoFromParts(m[1],+m[2],+m[3]);
  if((m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){const a=+m[1],b=+m[2];return a>12?isoFromParts(m[3],b,a):isoFromParts(m[3],a,b)}
  const mi=x=>MON.findIndex(n=>lc(x).startsWith(lc(n)))+1;
  if((m=s.match(/(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3,})[\s,\-]+(\d{2,4})/))&&mi(m[2])) return isoFromParts(m[3],mi(m[2]),+m[1]);
  if((m=s.match(/([A-Za-z]{3,})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/))&&mi(m[1])) return isoFromParts(m[3],mi(m[1]),+m[2]);
  return '';
}
function readSheet(ws){

  for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+12);r++){const row=[];for(let c=R.s.c;c<=R.e.c;c++){const x=ws[XLSX.utils.encode_cell({r,c})];row.push(x?lc(String(x.v).trim()):'')}
    if(row.some(h=>h==='training id'||h==='pin')){hr=r;heads=row;break}}
  if(hr<0) return [];
  const out=[];
  for(let r=hr+1;r<=R.e.r;r++){const o={_l:{},_t:{}};let any=false;
    for(let c=R.s.c;c<=R.e.c;c++){const h=heads[c-R.s.c];if(!h) continue;const x=ws[XLSX.utils.encode_cell({r,c})];if(!x) continue;
      o[h]=typeof x.v==='string'?x.v.trim():x.v;o._t[h]=x.t;if(x.l&&x.l.Target) o._l[h]=x.l.Target;if(o[h]!==''&&o[h]!=null) any=true}
    if(any) out.push(o)}
  return out;
}

const pinOf=v=>String(v??'').trim().replace(/\.0$/,'');
const splitTrainers=s=>String(s||'').split(/\s*(?:&|;|\/|\band\b|\n)\s*/i).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/^[—–\-?.]+$/.test(x));

async function runImport(){

  const D={...D0,sess:D0.sess.filter(x=>!keep.has('sess:'+x.id)),att:D0.att.filter(x=>!keep.has('sess:'+x.id)),ind:D0.ind.filter(x=>!keep.has('ind:'+x.id))};btn.disabled=true;btn.textContent='Importing…';

    if(D.settings&&typeof D.settings==='object') await post({action:'settings',settings:D.settings,note:'Restored from backup'});
    await post({action:'importDone',note:`${I.file}: ${D.sess.length} sessions, ${D.ind.length} individual trainings${I.emp?`, ${D.emp.length} employees`:''}`});

}

function peopleIndex(){

  known.forEach(p=>{const em=lc((p.sm&&p.sm.email)||(RAW.emp[p.pin]||{}).email||'').trim();if(em) byEmail[em]=p.pin;const k=nameKey(p.name);if(k)(byName[k]=byName[k]||[]).push(p);[...p.altNames].forEach(n=>{const k2=nameKey(n);if(k2&&k2!==k)(byName[k2]=byName[k2]||[]).push(p)})});
  return {byEmail,byName};

// Returns {pin, via, cands} for one person reference. Ambiguous names return candidates for HR to choose.
function matchPerson(ref,IX){
  const pinRaw=String(ref.pin??'').trim().replace(/\.0$/,''), em=lc(ref.email||'').trim(), nm=String(ref.name||'').trim();
  if(pinRaw){const p=MD.rp(pinRaw);const P=MD.P[p];if(P&&(P.inMaster||P.sm)) return {pin:p,via:'PIN'};}
  if(em&&IX.byEmail[em]) return {pin:IX.byEmail[em],via:'Email'};
  if(em&&!nm){const local=em.split('@')[0].replace(/[._-]+/g,' ');const c=IX.byName[nameKey(local)];if(c&&c.length===1) return {pin:c[0].pin,via:'Email name'}}
  if(nm){let c=IX.byName[nameKey(nm)]||[];c=[...new Map(c.map(p=>[p.pin,p])).values()];
    if(c.length>1){const a=c.filter(p=>p.status==='Active');if(a.length===1) return {pin:a[0].pin,via:'Name',cands:c}}
    if(c.length===1) return {pin:c[0].pin,via:'Name'};
    if(c.length>1) return {pin:'',via:'',cands:c};}
  if(pinRaw) return {pin:pinRaw,via:'Unknown PIN'};
  return {pin:'',via:''};
}
// Teams and Zoom durations: "1h 23m 10s", "45m 3s", "01:23:10", "83 min".
function parseDuration(v){
  if(v==null||v==='') return null;if(typeof v==='number') return v<1?+(v*24).toFixed(2):v>12?+(v/60).toFixed(2):v;
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d+):(\d{2})(?::(\d{2}))?$/))) return +((+m[1])+(+m[2])/60+(+(m[3]||0))/3600).toFixed(2);
  const h=+(s.match(/(\d+(?:\.\d+)?)\s*h/i)||[0,0])[1], mi=+(s.match(/(\d+)\s*m(?!s)/i)||[0,0])[1], se=+(s.match(/(\d+)\s*s/i)||[0,0])[1];
  if(h||mi||se) return +(h+mi/60+se/3600).toFixed(2);
  const n=parseFloat(s);return isFinite(n)?n:null;
}

function detectSheet(ws){

    const score=['pin','email','name'].filter(k=>map[k]!=null).length*3+['topic','course','date','hours','trainer','amount','dept'].filter(k=>map[k]!=null).length;
    if(score>=3&&(!best||score>best.score)) best={r,heads,map,score};
  }

    for(const [k,i] of Object.entries(best.map)){const x=ws[XLSX.utils.encode_cell({r,c:R.s.c+i})];if(!x||x.v==null||x.v==='') continue;o[k]=typeof x.v==='string'?x.v.trim():x.v;o['_t_'+k]=x.t;any=true}
    if(any) rows.push(o)}

}

/* ---------- 1. feedback and impact ---------- */
const LIKERT=[[/^strongly agree$/,5],[/^agree$/,4],[/^(neutral|neither.*)$/,3],[/^disagree$/,2],[/^strongly disagree$/,1],[/^excellent$/,5],[/^very good$/,4],[/^good$/,3],[/^(fair|average|ok|okay)$/,2],[/^poor$/,1],[/^very satisfied$/,5],[/^satisfied$/,4],[/^dissatisfied$/,2],[/^very dissatisfied$/,1],[/^extremely (useful|helpful|relevant)$/,5],[/^very (useful|helpful|relevant)$/,4],[/^(somewhat|moderately) (useful|helpful|relevant)$/,3],[/^slightly (useful|helpful|relevant)$/,2],[/^not (at all )?(useful|helpful|relevant)$/,1]];
function scoreOf(v){if(v==null||v==='') return null;if(typeof v==='number') return v;const s=lc(String(v)).trim();const n=s.match(/^(\d+(?:\.\d+)?)(?:\s*(?:\/|out of)\s*(\d+))?/);if(n) return +n[1];const l=LIKERT.find(([re])=>re.test(s));return l?l[1]:null}
function parseFeedback(wb){
  const ws=wb.Sheets[wb.SheetNames[0]], A=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hr=A.findIndex(r=>r.filter(x=>String(x).trim()).length>=2);if(hr<0) throw new Error('The file has no table.');
  const H=A[hr].map(h=>String(h).trim()), rows=A.slice(hr+1).filter(r=>r.some(x=>String(x).trim()!==''));
  if(!rows.length) throw new Error('No responses found.');
  const skip=/^(id|start time|completion time|last modified time|email|name|full name|employee name|pin|employee id|language|department|designation|total points|quiz feedback)$/i;
  const qs=[],comments=[];let nps=null;
  H.forEach((h,c)=>{if(!h||skip.test(h)||/points|feedback -|^grade/i.test(h)) return;
    const vals=rows.map(r=>r[c]).filter(v=>String(v).trim()!=='');if(!vals.length) return;
    const sc=vals.map(scoreOf).filter(v=>v!=null);
    if(sc.length/vals.length>=.7){const mx=Math.max(...sc),mn=Math.min(...sc);const scale=mx>5?10:5;
      if(scale===10&&(/recommend|likely/i.test(h)||mn===0)){const pro=sc.filter(v=>v>=9).length,det=sc.filter(v=>v<=6).length;nps=Math.round((pro-det)/sc.length*100);qs.push({q:h,avg:+(sc.reduce((a,v)=>a+v,0)/sc.length).toFixed(2),n:sc.length,scale:10,nps:true});return}
      qs.push({q:h,avg:+(sc.reduce((a,v)=>a+v,0)/sc.length).toFixed(2),n:sc.length,scale});return}
    const avgLen=vals.reduce((a,v)=>a+String(v).length,0)/vals.length;
    if(avgLen>12) vals.forEach(v=>{const t=String(v).trim();if(t.length>3&&!/^(n\/?a|none|no|nothing|-)$/i.test(t)) comments.push({q:h,t:t.slice(0,300)})});
  });
  const rq=qs.filter(q=>!q.nps);
  if(!rq.length&&nps==null) throw new Error('No rating questions were found. Ratings need numbers (1–5 or 1–10) or answers like “Agree” or “Very good”.');
  const avg=rq.length?+(rq.reduce((a,q)=>a+q.avg/q.scale*5,0)/rq.length).toFixed(2):null;
  return {n:rows.length,avg,nps,qs,comments:comments.slice(0,40)};
}

function ratingOf(list){let w=0,t=0;list.forEach(s=>{const f=s.feedback;if(f&&f.avg){const n=f.n||1;w+=n;t+=f.avg*n}});return w?t/w:null}

const reqRules=()=>Array.isArray(RAW.settings.required)?RAW.settings.required:[];
function reqMatch(r,s){if((s.req||[]).includes(r.id)) return true;const k=String(r.keywords||'').split(',').map(x=>lc(x).trim()).filter(Boolean);return k.length&&k.some(w=>lc(s.topic).includes(w))}
function reqStatus(r,p,yr){
  const sessions=Object.values(RAW.sess).filter(s=>reqMatch(r,s));
  const done=p.allSess.filter(x=>sessions.some(s=>s.id===x.id));
  const join=(RAW.emp[p.pin]||{}).joinDate||'';
  if(r.freq==='annual'){const d=done.filter(x=>String(x.date||'').startsWith(yr)||String(x.year)===yr);
    return d.length?{st:'Done',when:d[0].date,s:d[0]}:{st:yr<todayISO().slice(0,4)?'Missed':'Not done',when:''}}
  if(done.length) return {st:'Done',when:done[0].date,s:done[0]};
  if(r.days&&join){const due=addDays(join,+r.days);return {st:todayISO()>due?'Overdue':'Due',due}}

function reqScope(r){
  const join=p=>(RAW.emp[p.pin]||{}).joinDate||'';

    if(r.depts&&r.depts.length&&!r.depts.includes(p.dept)) return false;
    if(r.since){const j=join(p);if(!j||j<r.since) return false}

}

function loadJSZip(){if(window.JSZip) return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>window.JSZip?res():rej(new Error('Could not load the Word builder.'));s.onerror=()=>rej(new Error('Could not load the Word builder. Check your connection.'));document.head.appendChild(s)})}
const X=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function inviteStats(s){
  const inv=((RAW.att[s.id]||{}).invited)||[];if(!inv.length) return null;
  const invS=new Set(inv.map(p=>MD.rp(p))), came=new Set(s._att.map(a=>a.p.pin));
  const attended=[...invS].filter(p=>came.has(p)), noShow=[...invS].filter(p=>!came.has(p)), walkIn=[...came].filter(p=>!invS.has(p));
  return {inv:invS.size,attended:attended.length,noShow,walkIn:walkIn.length,rate:pct(noShow.length,invS.size)};
}

/* ---------- 10. Skill Map follow-up ---------- */
function followModel(){
  const out=[];
  MD.people.forEach(p=>{const d=p.sm;if(!d||d.unmapped) return;const surveyed=String(d.submitted||'').slice(0,10);
    const seen=new Set();
    p.sess.forEach(x=>{const s=x.s;if(!s.date||(surveyed&&s.date<=surveyed)) return;s._areas.forEach(a=>{if(seen.has(a)) return;const A=AREAS.find(z=>z.n===a);if(!A) return;
      const lv=Math.max(0,...(d.skills||[]).filter(k=>A.cats.includes(k.cat)||(A.skillRe&&A.skillRe.test(k.name))).map(k=>k.level));
      if(lv<=2){seen.add(a);out.push({p,a,s,lv,surveyed})}})});
  });
  return out.sort((a,b)=>String(b.s.date).localeCompare(String(a.s.date)));
}
function followHTML(){
  const F=followModel();
  return `<div class="card panel" style="margin-top:16px"><div class="lhtop"><div><h2>Skill Map follow-up</h2><p class="hint" style="max-width:80ch">People who attended training in a skill area after their last Skill Map survey, and who reported little or no experience in that area at the time. Ask them to update their skills in the next survey cycle so the gap figures stay accurate.</p></div>
   ${F.length?'<div class="lhbtns"><button class="btn sm" type="button" data-act="fu-xlsx">Download (.xlsx)</button><button class="btn sm" type="button" data-act="fu-email">Email draft</button></div>':''}</div>
   ${F.length?`<div class="tblwrap trtbl"><table><thead><tr><th>Person</th><th>Skill area</th><th>Training</th><th>Level at last survey</th></tr></thead><tbody>${F.slice(0,300).map(x=>`<tr><td><button class="linkbtn" type="button" data-ppl="${esc(x.p.pin)}">${esc(x.p.name)}</button><div class="hint">${esc(x.p.dept)}</div></td><td>${esc(x.a)}</td><td class="wrap sm">${esc(x.s.topic)} · ${esc(fmtDate(x.s.date))}</td><td>${x.lv?['','Less than 1 year','1–3 years'][x.lv]:'Not reported'}${x.surveyed?`<div class="hint">Survey ${esc(fmtDate(x.surveyed))}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">No one to follow up. Either the training came before their survey, or they already reported experience in that area.</p>'}</div>`;

function calHTML(){

  const first=new Date(Date.UTC(y,m,1)), days=new Date(Date.UTC(y,m+1,0)).getUTCDate(), lead=(first.getUTCDay()+6)%7, key=d=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const cells=[];for(let i=0;i<lead;i++) cells.push('<div class="cday empty"></div>');
  for(let d=1;d<=days;d++){const k=key(d), ss=S.filter(s=>s.date===k), pp=P.filter(p=>p.date===k&&!p.sessionId);
    cells.push(`<div class="cday ${k===todayISO()?'today':''}"><span class="cnum">${d}</span>${ss.map(s=>`<button type="button" class="cev ${s.kind==='External'?'ext':''}" data-ses="${esc(s.id)}" title="${esc(s.topic)}">${esc(s.topic)}</button>`).join('')}${pp.map(p=>`<button type="button" class="cev plan" data-plan="${esc(p.id)}" title="Planned: ${esc(p.title)}">${esc(p.title)}</button>`).join('')}</div>`)}

  <div class="monthstrip">${busy.map((n,i)=>`<button type="button" data-calm="${i}" class="${i===m?'on':''}" title="${n} session${n===1?'':'s'}">${MON[i]}<b>${n||''}</b></button>`).join('')}</div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="chead">${d}</div>`).join('')}${cells.join('')}</div>
  ${up.length?`<div class="card panel" style="margin-top:16px"><h2>Upcoming</h2><div class="rows">${up.map(s=>`<div class="row"><div><button class="linkbtn" type="button" data-ses="${esc(s.id)}"><b>${esc(s.topic)}</b></button></div><span>${esc(fmtDate(s.date))}</span></div>`).join('')}</div></div>`:''}`;
}

function batchInfo(s){
  const a=RAW.att[s.id]||{}, enrolled=(a.invited||[]).map(p=>MD.rp(p)), wait=(a.waitlist||[]).map(p=>MD.rp(p));
  const came=new Set(((a.rows)||[]).filter(r=>r[5]!==0&&r[5]!=='0').map(r=>MD.rp(r[0])));
  const cap=+s.capacity||+((RAW.course||{})[s.courseId]||{}).capacity||0, past=s.date&&s.date<todayISO();
  const st=s.cancelled?'Cancelled':past||came.size?'Completed':!s.date?'Date to be set':cap&&enrolled.length>=cap?'Full':'Open';
  const completed=enrolled.filter(p=>came.has(p)).length;
  return {enrolled,wait,came,cap,st,completed,compRate:enrolled.length?pct(completed,enrolled.length):null};
}
function acadModel(){
  const all=Object.values(RAW.sess).filter(isAcad).map(s=>MD.all.find(x=>x.id===s.id)||s);
  const inY=s=>!ui.year||String(s.year)===ui.year;
  const ys=MD.sessions.filter(isAcad);
  const learners=new Set();ys.forEach(s=>s._att.forEach(a=>learners.add(a.p.pin)));
  const B=all.map(s=>({s,b:batchInfo(s)}));
  const withEnrol=B.filter(x=>inY(x.s)&&x.b.st==='Completed'&&x.b.enrolled.length);
  return {all,ys,B,learners,lh:ys.reduce((a,s)=>a+s._lh,0),rating:ratingOf(ys),
    upcoming:B.filter(x=>!['Completed','Cancelled'].includes(x.b.st)).sort((a,b)=>String(a.s.date||'9999').localeCompare(String(b.s.date||'9999'))),
    run:B.filter(x=>inY(x.s)&&x.b.st==='Completed'),comp:withEnrol.length?pct(withEnrol.reduce((a,x)=>a+x.b.completed,0),withEnrol.reduce((a,x)=>a+x.b.enrolled.length,0)):null};
}

async function saveEnrol(add,o={}){
  const id=ui.enSess, a=RAW.att[id]||{rows:[]}, s=RAW.sess[id], cap=+s.capacity||+((RAW.course||{})[s.courseId]||{}).capacity||0;
  let inv=(a.invited||[]).map(String), wait=(a.waitlist||[]).map(String);
  if(o.remove){inv=inv.filter(p=>p!==o.remove);wait=wait.filter(p=>p!==o.remove)}
  if(o.unwait) wait=wait.filter(p=>p!==o.unwait);
  if(o.promote){wait=wait.filter(p=>p!==o.promote);if(!inv.includes(o.promote)) inv.push(o.promote)}
  let toWait=0;(add||[]).forEach(p=>{if(inv.includes(p)||wait.includes(p)) return;if(cap&&inv.length>=cap){wait.push(p);toWait++}else inv.push(p)});
  await putMany('att',[{id,rows:a.rows||[],invited:inv,waitlist:wait}],{note:`Enrolment for ${s.topic}${s.batch?' '+s.batch:''}: ${inv.length} enrolled, ${wait.length} waiting`});
  await loadAll(true);enrolForm(id);if(add&&add.length) toast(`${add.length-toWait} enrolled${toWait?`, ${toWait} on the waitlist`:''}`);
}

function timelineOf(p){

  Object.values(RAW.ind).filter(i=>MD.rp(i.pin)===p.pin).forEach(i=>T.push({date:i.date||'',year:String(i.year||''),kind:i.kind==='Certification'?'Certification':'Course',title:i.title,sub:[i.provider,inferMode(i),i.expiry?`expires ${fmtDate(i.expiry)}`:''].filter(Boolean).join(' · '),hours:0,cat:i.category||'',iid:i.id,count:+i.count!==0}));

}

function parseAtt(txt){
  const seen=new Set(),rows=[],unknown=[];let dups=0;
  String(txt||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^([A-Za-z0-9-]+)\s*(?:[,\t;]\s*([0-9.]+))?/);if(!m) return;const pin=MD.rp(m[1]);
    if(seen.has(pin)){dups++;return}seen.add(pin);
    const p=MD.P[pin];if(!p||!(p.inMaster||p.sm)) unknown.push(pin);
    rows.push([pin,p?p.name:'',p?(p.trDept||p.dept):'',p?p.desig:'',m[2]!=null?+m[2]:'',1]);
  });
  return {rows,unknown,dups};
}

  if(D.sesedit) return sessForm(D.sesedit);
  if(D.unmerge){const a={...(RAW.settings.trainerAlias||{})};delete a[D.unmerge];return saveSettings({trainerAlias:a},`Unmerged trainer ${D.unmerge}`).then(()=>toast('Unmerged')).catch(x=>toast(x.message))}
  if(D.mfrom){const a={...(RAW.settings.trainerAlias||{})};a[lc(D.mfrom)]=D.mto;Object.keys(a).forEach(k=>{if(lc(a[k])===lc(D.mfrom)) a[k]=D.mto});return saveSettings({trainerAlias:a},`Merged trainer ${D.mfrom} into ${D.mto}`).then(()=>toast('Trainers merged')).catch(x=>toast(x.message))}
  if(D.aliasFrom||D.aliasGo){const from=D.aliasFrom||D.aliasGo, to=D.aliasTo||($(`[data-alias-in="${CSS.escape(from)}"]`)?.value||'').trim();if(!to) return toast('Type the current PIN first.');if(to===from) return;
    const a={...(RAW.settings.pinAlias||{}),[from]:to};return saveSettings({pinAlias:a},`Linked PIN ${from} to ${to}`).then(()=>toast(`PIN ${from} now counts as ${to}`)).catch(x=>toast(x.message))}
  if(D.notsame){const n=[...new Set([...(RAW.settings.notSame||[]),D.notsame])];return saveSettings({notSame:n},`Marked PINs ${D.notsame.replace('>',' and ')} as different people`).then(()=>toast('Saved as different people')).catch(x=>toast(x.message))}
  if(D.unalias){const a={...(RAW.settings.pinAlias||{})};delete a[D.unalias];return saveSettings({pinAlias:a},`Unlinked PIN ${D.unalias}`).then(()=>toast('Unlinked')).catch(x=>toast(x.message))}
  if(D.dedupe){const r=(RAW.att[D.dedupe]||{}).rows||[],seen=new Set(),keep=[];r.forEach(x=>{const p=MD.rp(x[0]);if(x[5]===0||x[5]==='0'||seen.has(p)) return;seen.add(p);keep.push(x)});
    try{await putMany('att',[{id:D.dedupe,rows:keep}],{note:`Removed ${r.length-keep.length} extra attendance rows from ${D.dedupe}`});await loadAll(true);toast(`Removed ${r.length-keep.length} rows`)}catch(x){toast(x.message)}return}
  const a=D.act;if(!a) return;
  if(a==='modal-close') return closeModal();
  if(a==='stay'){markActive(true);hideIdleWarn();return}
  if(a==='lock') return lock('Locked.');
  if(a==='print-ov'){document.body.dataset.printed=today();document.body.classList.add('print-ov');window.addEventListener('afterprint',()=>document.body.classList.remove('print-ov'),{once:true});try{window.print()}catch(_){}return}
  if(a==='export-wb') return exportWorkbook(false);
  if(a==='template') return exportWorkbook(true);
  if(a==='backup') return saveBlob(`training-backup-${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify({exported:new Date().toISOString(),training:RAW},null,1)],{type:'application/json'}));
  if(a==='imp-run') return runImport();
  if(a==='imp-cancel'){ui.imp=null;return renderImp()}
  if(a==='pmore'){ui.pShow+=120;return renderPplList()}
  if(a==='ses-new') return sessForm(null);
  if(a==='ses-edit') return sessForm(ui.sSel);
  if(a==='ses-del'){if(ui.delArm!==ui.sSel){ui.delArm=ui.sSel;return renderSesDetail()}const id=ui.sSel;ui.delArm=null;try{await delMany('sess',[id],{note:`Deleted session ${id}: ${(RAW.sess[id]||{}).topic||''}`});ui.sSel=null;await loadAll(true);toast('Session deleted')}catch(x){toast(x.message)}return}
  if(a==='ind-new'){ui.delArm=null;return indForm(null)}
  if(a==='ind-del'){const id=$('#ifId').value;if(ui.delArm!=='ind:'+id){ui.delArm='ind:'+id;b.classList.add('armed');b.textContent='Confirm delete';return}ui.delArm=null;try{await delMany('ind',[id],{note:`Deleted ${id}`});closeModal();await loadAll(true);toast('Deleted')}catch(x){toast(x.message)}return}
  if(a==='plan-new'){ui.delArm=null;return planForm(null)}
  if(a==='plan-del'){const id=ui.planEdit;if(ui.delArm!=='plan:'+id){ui.delArm='plan:'+id;b.classList.add('armed');b.textContent='Confirm delete';return}ui.delArm=null;try{await delMany('plan',[id],{note:'Deleted plan item'});closeModal();await loadAll(true);toast('Deleted')}catch(x){toast(x.message)}return}
  if(a==='trn-merge'){const to=$('#trnMerge').value,t=MD.T[ui.tSel];if(!to||!t) return toast('Choose the trainer to merge with.');const al={...(RAW.settings.trainerAlias||{})};al[lc(t.name)]=to;
    try{await saveSettings({trainerAlias:al},`Merged trainer ${t.name} into ${to}`);ui.tSel=lc(to);renderTrn();toast('Trainers merged')}catch(x){toast(x.message)}return}
  if(a==='ses-xlsx'){const L=sessFiltered();return simpleXlsx(`Training sessions ${yearLabel()}`,[['Training ID',14],['Date',12],['Topic',40,null,1],['Trainers',26,null,1],['Type',10],['Format',15],['Category',20],['Hours',8],['Attendees',10],['Learner-hours',11],['Departments',10],['Skill areas',28,null,1],['Feedback collected',10]],L.map(s=>[s.id,fmtDate(s.date,s.dateText),s.topic,s.trainers.join(' & '),s.kind,s.classType,s.category,+s.hours||0,s._n,Math.round(s._lh),new Set(s._att.map(x=>x.p.dept)).size,s._areas.join(', '),s.feedbackCollected]))}
  if(a==='att-xlsx'){const s=MD.sessions.find(x=>x.id===ui.sSel);if(!s) return;return simpleXlsx(`Attendees ${s.id}`,[['PIN',9],['Name',28],['Department',26],['Designation',28],['Status',12],['Hours',8]],[...s._att].sort((x,y)=>x.p.dept.localeCompare(y.p.dept)||x.p.name.localeCompare(y.p.name)).map(x=>[x.p.pin,x.p.name,x.p.dept,x.p.desig,x.p.status,x.h]))}
  if(a==='ppl-xlsx'){const L=pplFiltered();return simpleXlsx(`People training ${yearLabel()}`,[['PIN',9],['Name',28],['Department',26],['Designation',28],['Status',12],['Group sessions',10],['Hours',8,'0.#'],['Individual trainings',11],['Spend (BDT)',12,'#,##0'],['Sessions',60,null,1]],L.map(p=>[p.pin,p.name,p.dept,p.desig,p.status,p.sess.length,+p.hours.toFixed(1),p.counted,p.spend||'',p.sess.map(x=>x.s.topic).join(' | ')]))}
  if(a==='ind-xlsx') return simpleXlsx(`Individual trainings ${yearLabel()}`,[['ID',14],['PIN',9],['Name',26],['Department',24],['Course or certification',40,null,1],['Type',14],['Training type',24],['Nominated by',22],['Amount (BDT)',12,'#,##0'],['Payment',10],['Counts as training',10]],MD.ind.map(i=>{const p=MD.P[i._pin];return [i.id,i.pin,p?p.name:i.name,p?p.dept:i.dept,i.title,i.kind,i.type,i.nomName,num(i.amount),i.payStatus,+i.count===0?'No':'Yes']}));
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal') closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden) closeModal()});

/* ---------- theme ---------- */
const THEMES=[['auto','Auto'],['light','Light'],['dark','Dark']];let THEME='auto';try{THEME=localStorage.getItem('skillmap_theme')||'auto'}catch(_){}
function applyTheme(){if(THEME==='auto') document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',THEME);const b=$('#themeBtn');if(b){const n=THEMES.find(x=>x[0]===THEME)[1];b.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span>${n}</span>`;b.title=`Theme: ${n}. Select to change.`}}
document.addEventListener('click',ev=>{if(!ev.target.closest('#themeBtn')) return;THEME=THEMES[(THEMES.findIndex(x=>x[0]===THEME)+1)%3][0];try{localStorage.setItem('skillmap_theme',THEME)}catch(_){}applyTheme()});
applyTheme();

/* ---------- sign-in (shared with the Skill Map) ---------- */
const LOCK_SVG='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
function showGate(html){$('#gate').hidden=false;$('#app').hidden=true;$('#hdrRight').hidden=true;$('#gateCard').innerHTML=html}
function gateForm(msg){
  let nm='';try{nm=localStorage.getItem('skillmap_name')||''}catch(_){}
  showGate(`<div class="lockicon">${LOCK_SVG}</div><h2>HR access only</h2><p class="hint" style="margin:0">Training records for BRAC IT HR and L&amp;D. Use the same passcode as the Skill Map.</p>
   <form id="gateForm" autocomplete="off"><label class="fl">Your name<input type="text" id="gateName" value="${esc(nm)}" placeholder="Recorded with any changes you make" required></label>
   <label class="fl">Passcode<input type="password" id="gatePass" autocomplete="current-password" required></label><div class="err" id="gateErr" role="alert">${esc(msg||'')}</div><button class="btn primary" type="submit" id="gateBtn">Unlock</button></form>`);
  setTimeout(()=>(nm?$('#gatePass'):$('#gateName'))?.focus(),50);
}
function unlock(sess){
  unlocked=true;isEditor=sess.role==='editor';me=sess;markActive(true);
  $('#gate').hidden=true;$('#app').hidden=false;$('#hdrRight').hidden=false;
  $('#roleChip').textContent=(isEditor?'HR editor':'View only')+(sess.name?' · '+sess.name:'');
  ['tabDq','tabImp','tabSet'].forEach(id=>$('#'+id).hidden=!isEditor);
  const h=(location.hash||'').slice(1), dm=h.match(/^ppl=(.+)$/);if(dm){ui.tab='ppl';ui.pSel=decodeURIComponent(dm[1]);ui.pStat=''}else if(RENDER[h]) ui.tab=h;
  MD=build();setTab(ui.tab);
  loadAll(true).then(()=>{if(!ui.year){const y=years();if(y.length) ui.year=y[0];rebuild()}});
  clearInterval(SYNC.timer);SYNC.timer=setInterval(()=>{if(unlocked&&!document.hidden) loadAll()},30000);
}
async function lock(msg,o={}){
  const was=unlocked;unlocked=false;hideIdleWarn();clearInterval(SYNC.timer);closeModal();
  RAW={sess:{},att:{},ind:{},emp:{},plan:{},prog:{},course:{},settings:{}};SM={};MD=null;SYNC.tv=SYNC.sv=null;loaded=false;ui.imp=null;
  $$('#app>section').forEach(s=>{s.innerHTML='';delete s.dataset.built});
  if(!o.local){try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}catch(_){}if(was&&!o.fromTab) tabMsg({t:'lock',msg:o.idle?'Locked after 30 minutes without activity in any tab.':'Locked from another tab.'})}
  gateForm(msg);
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='gateForm') return;e.preventDefault();const btn=$('#gateBtn');btn.disabled=true;
  const name=$('#gateName').value.trim(),passcode=$('#gatePass').value;try{localStorage.setItem('skillmap_name',name)}catch(_){}
  try{const s=await api('/api/login',{method:'POST',body:{name,passcode},login:true});unlock(s);tabMsg({t:'login'})}
  catch(x){$('#gateErr').textContent=x.message||'Could not sign in.';$('#gatePass').select()}finally{if($('#gateBtn')) $('#gateBtn').disabled=false}
},true);
window.addEventListener('hashchange',()=>{const m=(location.hash||'').match(/^#ppl=(.+)$/);if(m&&unlocked&&MD){const pin=decodeURIComponent(m[1]);ui.pSel=pin;ui.pq='';ui.pDept='';ui.pTr='';ui.pStat='';setTab('ppl')}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unlocked) loadAll()});
/* Inactivity is shared with every Skill Map and Training tab in this browser. */
const ACT_KEY='skillmap_active',WARN_MS=2*60*1000;
const bc=('BroadcastChannel' in window)?new BroadcastChannel('skillmap'):null;
function tabMsg(m){try{bc&&bc.postMessage(m)}catch(_){}}
function markActive(force){const n=Date.now();if(!force&&n-lastActive<5000) return;lastActive=n;try{localStorage.setItem(ACT_KEY,String(n))}catch(_){}if(!$('#idleWarn').hidden) hideIdleWarn()}
function sharedLast(){let v=0;try{v=Number(localStorage.getItem(ACT_KEY))||0}catch(_){}return Math.max(v,lastActive)}
function hideIdleWarn(){const w=$('#idleWarn');if(w) w.hidden=true}
function checkIdle(){if(!unlocked) return;const left=IDLE_MS-(Date.now()-sharedLast());if(left<=0) return lock('Locked after 30 minutes without activity.',{idle:true});
  const w=$('#idleWarn');if(left<=WARN_MS){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;w.querySelector('span').textContent=`No activity for a while. This page locks in ${m}:${String(s).padStart(2,'0')}.`;w.hidden=false}else w.hidden=true}
['click','keydown','pointermove','scroll','touchstart'].forEach(n=>document.addEventListener(n,()=>markActive(),{passive:true}));
setInterval(checkIdle,5000);
if(bc) bc.onmessage=ev=>{const m=ev.data||{};if(m.t==='lock'&&unlocked) lock(m.msg||'Locked.',{local:true,fromTab:true});if(m.t==='login'&&!unlocked) api('/api/session',{login:true}).then(unlock).catch(()=>{})};
(async()=>{try{const s=await api('/api/session',{login:true});unlock(s)}catch(e){if(e.code===500) showGate(`<div class="lockicon">${LOCK_SVG}</div><h2>Setup needed</h2><p class="hint" style="margin:0">${esc(e.message)}</p>`);else gateForm()}})();


</script>
</body></html>
